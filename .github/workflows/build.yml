name: Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  QT_QPA_PLATFORM: offscreen

jobs:
  linux:
    name: Linux (GCC, Qt 6)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            cmake \
            ninja-build \
            qt6-base-dev \
            qt6-base-dev-tools \
            libgl1-mesa-dev \
            zlib1g-dev

      - name: Show tool versions
        run: |
          cmake --version
          g++ --version
          dpkg -l | grep -E 'qt6-base-dev|zlib1g-dev'

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Package
        run: |
          mkdir -p dist
          cp build/qtv8reader build/v8reader_cli dist/
          chmod +x dist/qtv8reader dist/v8reader_cli

      - name: Upload artifacts
        uses: actions/upload-artifact@v5
        with:
          name: qtv8reader-linux-x86_64
          path: dist/*
          if-no-files-found: error

  windows:
    name: Windows (MSYS2/MinGW, Qt 6)
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-qt6-base
            mingw-w64-ucrt-x86_64-zlib

      - name: Show tool versions
        run: |
          cmake --version
          g++ --version
          qmake6 --version || qmake --version || true

      - name: Configure
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$MINGW_PREFIX"

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Package with Qt and MinGW runtime
        run: |
          mkdir -p dist
          cp build/qtv8reader.exe build/v8reader_cli.exe dist/
          # загрузчик WebView2 для режима «точный вид» формы
          cp build/WebView2Loader.dll dist/
          WINDEPLOYQT=""
          for candidate in windeployqt6 windeployqt; do
            if command -v "$candidate" >/dev/null 2>&1; then
              WINDEPLOYQT="$candidate"
              break
            fi
          done
          if [ -n "$WINDEPLOYQT" ]; then
            "$WINDEPLOYQT" --no-translations --no-system-d3d-compiler --no-opengl-sw --compiler-runtime dist/qtv8reader.exe
            "$WINDEPLOYQT" --no-translations --no-system-d3d-compiler --no-opengl-sw --compiler-runtime dist/v8reader_cli.exe
          else
            echo "windeployqt не найден: артефакт будет без DLL Qt"
          fi
          deps=$( (ldd build/qtv8reader.exe; ldd build/v8reader_cli.exe; \
                   ldd dist/Qt6*.dll; ldd dist/platforms/*.dll) 2>/dev/null \
                  | awk '{print $3}' | grep -iE '^/(ucrt64|mingw64)/bin/' | sort -u )
          for d in $deps; do cp -n "$d" dist/ 2>/dev/null || true; done
          cp packaging/THIRD-PARTY-NOTICES.txt dist/THIRD-PARTY-NOTICES.txt

      - name: Upload artifacts
        uses: actions/upload-artifact@v5
        with:
          name: qtv8reader-windows-x86_64
          path: dist/*
          if-no-files-found: error

  plugin:
    name: Plugin (Node 22, real CLI)
    runs-on: windows-latest
    needs: windows
    defaults:
      run:
        working-directory: plugins/dsh-v8reader
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # Тесты плагина по умолчанию пропускаются без v8reader_cli: артефакт
      # соседнего job раскладывается туда, где плагин ищет сборку этого репозитория.
      - name: Download the CLI artifact
        uses: actions/download-artifact@v5
        with:
          name: qtv8reader-windows-x86_64
          path: out/cli-deploy

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: plugins/dsh-v8reader/pnpm-lock.yaml

      - name: Install
        run: pnpm install --frozen-lockfile --allow-build=esbuild

      - name: Build the client bundle
        run: pnpm run build

      - name: Committed bundle matches sources
        run: git diff --exit-code -- client.js

      - name: Test
        run: pnpm test

      - name: Package contents
        run: npm pack --dry-run
